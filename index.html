<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Kantin Digital: Literasi & Numerasi Python</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ec;--card:#fff;--tx:#1f2a2e;--mu:#5c6b70;--ac:#0f766e;--ac2:#fde68a;--ok:#15803d;--bad:#b91c1c;--code:#14232b;--cd:#e6f0ee;--bd:#d8d2c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12191c;--card:#1b262a;--tx:#e8eeee;--mu:#9fb0b4;--ac:#2dd4bf;--ac2:#854d0e;--ok:#4ade80;--bad:#f87171;--code:#0b1215;--cd:#d6e8e5;--bd:#2c3b40}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Arial,sans-serif;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0}h2{font-size:1.15rem;margin:0 0 8px}
.bar{display:flex;gap:6px;margin:10px 0}.bar i{flex:1;height:8px;border-radius:4px;background:var(--bd)}.bar i.on{background:var(--ac)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.story{border-left:5px solid var(--ac);background:var(--card);padding:12px 14px;border-radius:10px;margin:12px 0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--tx)}
pre{background:var(--code);color:var(--cd);padding:12px;border-radius:10px;overflow-x:auto;font:14px/1.6 Consolas,monospace;margin:8px 0}
pre .hl{background:rgba(250,204,21,.28);display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:transparent;color:var(--tx);border-radius:10px;padding:8px 14px;margin:3px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{opacity:.6;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--bd)}
.row span{flex:1;min-width:200px}
.fb{margin-top:8px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.box{border:2px solid var(--ac);border-radius:10px;padding:6px 12px;text-align:center;min-width:90px}
.box small{display:block;color:var(--mu);font-size:.75rem}.box b{font-size:1.15rem}
input[type=range]{width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--bd);padding:4px 8px;text-align:center}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.node{padding:8px 12px;border:2px solid var(--bd);border-radius:10px;color:var(--mu)}.node.on{border-color:var(--ok);color:var(--tx);background:var(--ac2);font-weight:700}
</style></head><body><main>
<div class="top"><span>🍛 Misi Kantin Digital</span><span id="sc">Skor: 0</span></div>
<div class="bar" id="bar"></div>
<div id="stage"></div>
</main>
<script>
const rp=n=>"Rp"+n.toLocaleString("id-ID");
const S={ch:0,score:0},TOT=8;
const names=["Awal","Baca Soal","Hitung","Percabangan","Perulangan","Debug","Akhir"];
const $=s=>document.getElementById(s);
function bar(){$("bar").innerHTML=names.map((_,i)=>`<i class="${i<=S.ch?"on":""}"></i>`).join("");$("sc").textContent="Skor: "+S.score+"/"+TOT}
function go(n){S.ch=n;bar();R[n]();scrollTo(0,0)}
const nxt=(t="Lanjut ➜")=>`<button class="p" id="nx" onclick="go(S.ch+1)">${t}</button>`;
// helper pilihan ganda
function quiz(id,opts,ci,exp,onDone){
  $(id).innerHTML=opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")+`<div class="fb" id="${id}f"></div>`;
  let done=false;
  $(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(done)return;const ok=+b.dataset.i===ci;
    if(ok){done=true;b.classList.add("ok");S.score++;bar();$(id+"f").className="fb ok";$(id+"f").innerHTML="✅ Tepat! "+exp;onDone&&onDone()}
    else{b.classList.add("no");b.disabled=true;$(id+"f").className="fb no";$(id+"f").textContent="Belum tepat, coba baca lagi dengan teliti."}
  })}
const R=[
()=>{$("stage").innerHTML=`<h1>Misi Kantin Digital</h1>
<div class="story">📖 <b>Cerita:</b> Rani, siswa kelas IX, ditantang Bu Sari, penjaga kantin: “Bisakah kamu membuat program Python agar kasir tidak salah menghitung?” Untuk berhasil, Rani butuh dua kemampuan: <b>literasi</b> (memahami teks soal dan pesan error) dan <b>numerasi</b> (menghitung dan bernalar dengan angka).</div>
<div class="card"><span class="tag">5 Bab</span><p>1) Membaca soal · 2) Variabel & hitungan · 3) Percabangan <code>if</code> · 4) Perulangan <code>for</code> · 5) Membaca pesan error</p><p>Bantu Rani menyelesaikan semuanya. Total ${TOT} poin!</p></div>${nxt("Mulai misi 🚀")}`},

()=>{const it=[["Jumlah nasi goreng dan es teh yang dibeli siswa","Input"],["Harga nasi dikali jumlah, lalu dijumlahkan dengan es teh","Proses"],["Jika total lebih dari Rp30.000, potong 10%","Proses"],["Tampilkan total bayar di layar kasir","Output"]];
$("stage").innerHTML=`<h2>Bab 1 · Literasi: Membaca Soal</h2><span class="tag">LITERASI</span>
<div class="story">Bu Sari berkata: “Nasi goreng <b>Rp12.000</b>, es teh <b>Rp4.000</b>. Kasir memasukkan jumlah pesanan, program menghitung total. <b>Jika total lebih dari Rp30.000</b>, siswa mendapat diskon 10%. Terakhir, tampilkan total bayar.”</div>
<div class="card"><p>Setiap program punya alur <b>Input → Proses → Output</b>. Kelompokkan tiap kalimat:</p>
${it.map((x,i)=>`<div class="row"><span>${x[0]}</span><div id="q${i}"></div></div>`).join("")}<div id="fin"></div></div>`;
let c=0;it.forEach((x,i)=>{const o=["Input","Proses","Output"];quiz("q"+i,o,o.indexOf(x[1]),"",()=>{if(++c==4)$("fin").innerHTML=nxt()})})},

()=>{$("stage").innerHTML=`<h2>Bab 2 · Numerasi: Variabel & Hitungan</h2><span class="tag">NUMERASI</span>
<div class="story">Seorang siswa memesan. Atur jumlahnya, lihat bagaimana variabel menyimpan angka di memori.</div>
<div class="card">Nasi goreng: <b id="vn">2</b> porsi <input type="range" id="n" min="0" max="6" value="2">
Es teh: <b id="ve">1</b> gelas <input type="range" id="e" min="0" max="6" value="1">
<pre id="cd"></pre><div class="vars" id="vs"></div>
<p><b>Tebak dulu:</b> berapa nilai <code>total</code> untuk pesanan di atas?</p><div id="q"></div><div id="fin"></div></div>`;
const up=()=>{const n=+$("n").value,e=+$("e").value,t=n*12000+e*4000;$("vn").textContent=n;$("ve").textContent=e;
$("cd").textContent=`nasi = ${n}\nes_teh = ${e}\ntotal = nasi * 12000 + es_teh * 4000\nprint("Total:", total)`;
$("vs").innerHTML=[["nasi",n],["es_teh",e],["total",t]].map(v=>`<div class="box"><small>${v[0]}</small><b>${v[1]}</b></div>`).join("");return t};
let lock=false;const draw=()=>{const t=up(),w=[t+4000,t,t-12000<0?t+8000:t-12000].sort(()=>.5-Math.random());
if(lock)return;const o=[...new Set([t,t+4000,t+12000])].sort((a,b)=>a-b);quiz("q",o.map(rp),o.indexOf(t),"Perkalian dilakukan lebih dulu, baru dijumlahkan.",()=>{lock=true;$("n").disabled=$("e").disabled=true;$("fin").innerHTML=nxt()})};
$("n").oninput=$("e").oninput=()=>{if(!lock){draw()}};draw()},

()=>{$("stage").innerHTML=`<h2>Bab 3 · Percabangan: if</h2><span class="tag">LITERASI + NUMERASI</span>
<div class="story">Aturan diskon: <b>total lebih dari Rp30.000</b> mendapat potongan 10%. Geser total belanja dan amati jalur mana yang menyala.</div>
<div class="card">Total belanja: <b id="tv"></b><input type="range" id="t" min="0" max="60000" step="2000" value="40000">
<div class="flow"><div class="node" id="a">total &gt; 30000 ?</div>➜<div class="node" id="y">YA: diskon 10%</div><div class="node" id="z">TIDAK: bayar penuh</div></div>
<pre id="cd"></pre>
<p><b>Tantangan:</b> jika total <b>Rp40.000</b>, berapa yang harus dibayar?</p><div id="q"></div><div id="fin"></div></div>`;
const up=()=>{const t=+$("t").value,d=t>30000;$("tv").textContent=rp(t);$("a").classList.add("on");$("y").classList.toggle("on",d);$("z").classList.toggle("on",!d);
const l=["total = "+t,"if total > 30000:","    bayar = total - total * 0.1","else:","    bayar = total","print(bayar)   # "+rp(d?t*.9:t)];
const h=d?[1,2]:[3,4];$("cd").innerHTML=l.map((x,i)=>h.includes(i)?`<span class="hl">${x}</span>`:x).join("\n")};
$("t").oninput=up;up();
quiz("q",["Rp40.000","Rp36.000","Rp4.000"],1,"40.000 − 10% × 40.000 = 40.000 − 4.000 = 36.000.",()=>$("fin").innerHTML=nxt())},

()=>{const d=[2,1,3,4,2];$("stage").innerHTML=`<h2>Bab 4 · Perulangan: for</h2><span class="tag">NUMERASI</span>
<div class="story">Bu Sari ingin tahu rata-rata nasi goreng per siswa. Ada 5 siswa memesan: <b>${d.join(", ")}</b> porsi. Jalankan perulangan langkah demi langkah.</div>
<div class="card"><pre>pesanan = [2, 1, 3, 4, 2]
jumlah = 0
for p in pesanan:
    jumlah = jumlah + p
rata = jumlah / len(pesanan)</pre>
<table><tr><th>Putaran</th><th>p</th><th>jumlah</th></tr><tbody id="tb"></tbody></table>
<button class="p" id="st">Langkah berikutnya ▶</button><div id="res"></div><div id="q"></div><div id="fin"></div></div>`;
let i=0,s=0;$("st").onclick=()=>{if(i<5){s+=d[i];$("tb").innerHTML+=`<tr><td>${++i}</td><td>${d[i-1]}</td><td>${s}</td></tr>`}
if(i==5){$("st").disabled=true;$("res").innerHTML=`<p>Perulangan selesai: jumlah = <b>${s}</b>. <b>Tantangan:</b> berapa nilai <code>rata</code> (jumlah ÷ 5)?</p>`;
quiz("q",["12","2,4","2"],1,"12 ÷ 5 = 2,4 porsi per siswa.",()=>$("fin").innerHTML=nxt())}}},

()=>{$("stage").innerHTML=`<h2>Bab 5 · Literasi: Membaca Pesan Error</h2><span class="tag">LITERASI</span>
<div class="story">Program Rani tiba-tiba berhenti dan menampilkan tulisan merah. Jangan panik: pesan error adalah “teks bacaan” yang memberi petunjuk!</div>
<div class="card"><pre>total = 2 * 12000
print("Total bayar: " + total)</pre>
<pre style="color:#fca5a5">TypeError: can only concatenate str (not "int") to str</pre>
<p>Artinya: tanda <code>+</code> hanya bisa menyambung teks dengan teks, sedangkan <code>total</code> berupa angka. <b>Perbaikan mana yang benar?</b></p><div id="q"></div><div id="fin"></div></div>`;
quiz("q",['print("Total bayar: " + str(total))','total = "24000"','hapus baris print'],0,"<code>str(total)</code> mengubah angka menjadi teks, sehingga bisa disambung.",()=>$("fin").innerHTML=nxt("Lihat hasil 🏆"))},

()=>{const p=Math.round(S.score/TOT*100);$("stage").innerHTML=`<h1>Misi selesai! 🎉</h1>
<div class="card"><p style="font-size:1.4rem">Skor kamu: <b>${S.score}/${TOT}</b> (${p}%)</p>
<p>${p>=80?"Hebat! Rani siap membuat program kantin yang andal.":"Bagus! Ulangi bab yang belum tepat untuk memperkuat pemahamanmu."}</p></div>
<div class="card"><b>Rangkuman</b><ul><li><b>Literasi:</b> memahami soal (Input–Proses–Output) dan membaca pesan error.</li><li><b>Numerasi:</b> variabel, urutan operasi, kondisi <code>if</code>, dan perulangan <code>for</code>.</li></ul>
<b>Refleksi:</b> bagian mana yang paling sulit? Bagaimana kamu menggunakan program serupa di kehidupan sehari-hari?</div>
<button class="p" onclick="S.score=0;go(0)">Main lagi 🔁</button>`}
];
go(0);
</script></body></html>
